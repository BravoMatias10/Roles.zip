{% extends 'cuentas/base.html' %}
{% block contenido %}
<section class="tarjeta">
    <h1>{{ titulo }}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="acciones">
            <button class="boton" type="submit">Guardar</button>
            <a class="boton secundario" href="{% url 'inicio' %}">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
