{% extends 'cuentas/base.html' %}
{% block contenido %}
<section class="tarjeta">
    <h1>Eliminar producto</h1>
    <p>¿Quieres eliminar «{{ producto.nombre }}»? Esta acción no se puede deshacer.</p>
    <form method="post">
        {% csrf_token %}
        <div class="acciones">
            <button class="boton peligro" type="submit">Sí, eliminar</button>
            <a class="boton secundario" href="{% url 'inicio' %}">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
